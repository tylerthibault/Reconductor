name: Tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Reconductor
        run: python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate local dashboard JavaScript
        run: node --check src/reconductor/static/app.js
      - name: Check dashboard confirmation UX
        run: node tests/test_frontend.cjs
      - name: Check readable research result grouping
        run: node tests/test_readable_results.cjs
      - name: Validate independent network JavaScript
        run: node --check src/reconductor/static/network.js
      - name: Test automatic grouping and membership UI
        run: node tests/test_network_layout.cjs
      - name: Validate Tool Manager JavaScript
        run: node --check src/reconductor/static/tools.js
      - name: Smoke test CLI
        run: |
          reconductor --help
          reconductor scan --help
          reconductor doctor
