[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reconductor"
version = "0.6.1"
description = "Terminal-first multi-tool OSINT orchestration with local case files"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Reconductor contributors"}]
dependencies = []
keywords = ["osint", "recon", "cli", "investigation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Topic :: Security",
]

[project.scripts]
reconductor = "reconductor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reconductor = ["static/*"]
